display:
  width: 1920
  height: 1200
  fullscreen: true
  overlay: true
  fade_ms: 400
  # Artwork stays on screen during hold; next ID replaces it
  hold_until_next_track: true
  idle_timeout_s: 45   # demo-art only
  idle_color: [12, 12, 18]
  background_color: [0, 0, 0]
  overlay_bg_alpha: 140
  overlay_padding: 24
  fps: 30

audio:
  device: "USB PnP Sound Device"  # null | device index | name substring
  sample_rate: 44100              # auto = device default
  channels: 1
  block_size: 4096
  sample_seconds: 10              # fixed capture window for YAMNet + AudD
  normalize: true
  target_peak: 0.9
  max_gain: 40.0
  sample_dir: ~/.cache/auraframe/samples
  max_sample_files: 20
  # legacy energy gate (unused by YAMNet live loop)
  gate_window_s: 1.5
  gate_rms_threshold: 0.02
  gate_band_ratio_min: 0.25
  gate_min_hz: 200
  gate_max_hz: 5000
  gate_hits_required: 3
  cooldown_s: 30
  check_interval_s: 1.0
  silence_interval_s: 2.5

yamnet:
  music_threshold: 0.35
  hop_s: 0.48
  # model auto-downloaded to assets/models/ on first run if missing

recognition:
  provider: audd
  api_url: https://api.audd.io/
  api_token_env: AUDD_API_TOKEN
  return_meta: apple_music,spotify
  cache_dir: ~/.cache/auraframe/recognition
  cache_ttl_s: 3600
  timeout_s: 15
  artwork_size: 1000
  end_margin_s: 5          # extra wait after predicted song end
  default_remaining_s: 180 # fallback hold if duration unknown

artwork:
  cache_dir: ~/.cache/auraframe/art
  max_cache_mb: 500
  max_age_days: 30
  download_timeout_s: 20
  download_retries: 3
  retry_backoff_s: 0.75

logging:
  level: INFO
