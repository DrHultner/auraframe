display:
  width: 1920
  height: 1200
  fullscreen: true
  overlay: true
  fade_ms: 400
  idle_timeout_s: 45
  idle_color: [12, 12, 18]
  background_color: [0, 0, 0]
  overlay_bg_alpha: 140
  overlay_padding: 24
  fps: 30

audio:
  device: null          # null | device index | name substring
  sample_rate: 44100
  channels: 1
  block_size: 2048
  sample_seconds: 12
  gate_window_s: 1.5
  gate_rms_threshold: 0.02
  gate_band_ratio_min: 0.25
  gate_min_hz: 200
  gate_max_hz: 5000
  gate_hits_required: 3   # sustained music before capture
  normalize: true         # boost quiet ambient mic levels for AudD
  target_peak: 0.9
  max_gain: 40.0
  cooldown_s: 30
  check_interval_s: 1.0
  silence_interval_s: 2.5
  sample_dir: ~/.cache/auraframe/samples
  max_sample_files: 20

recognition:
  provider: audd
  api_url: https://api.audd.io/
  api_token_env: AUDD_API_TOKEN
  return_meta: apple_music,spotify
  cache_dir: ~/.cache/auraframe/recognition
  cache_ttl_s: 3600
  timeout_s: 15
  artwork_size: 1000

artwork:
  cache_dir: ~/.cache/auraframe/art
  max_cache_mb: 500
  max_age_days: 30
  download_timeout_s: 20
  download_retries: 3
  retry_backoff_s: 0.75

logging:
  level: INFO
